openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Aegis Rise member, social feed, and chapter administration API.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: social
  - name: members
  - name: posts
  - name: shares
  - name: uploads
  - name: admin
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /readyz:
    get:
      operationId: readinessCheck
      tags: [health]
      summary: Database readiness check
      responses:
        "200":
          description: Application and database are ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: Database is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/signup:
    post:
      operationId: signup
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupInput"
      responses:
        "201":
          description: Pending member created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignupResult"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /auth/social/connect/{platform}:
    post:
      operationId: createSocialConnection
      tags: [social]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/SocialPlatform"
      responses:
        "200":
          description: A short-lived browser redirect URL for provider authorization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SocialConnectResult"
    get:
      operationId: redirectToSocialProvider
      tags: [social]
      parameters:
        - $ref: "#/components/parameters/SocialPlatform"
        - name: state
          in: query
          required: true
          schema: { type: string }
      responses:
        "302":
          description: Redirect to the configured OAuth provider
  /auth/social/callback/{platform}:
    get:
      operationId: handleSocialCallback
      tags: [social]
      parameters:
        - $ref: "#/components/parameters/SocialPlatform"
        - name: code
          in: query
          schema: { type: string }
        - name: state
          in: query
          required: true
          schema: { type: string }
        - name: error
          in: query
          schema: { type: string }
      responses:
        "302":
          description: Redirect back to the member profile with the result
  /auth/social/accounts:
    get:
      operationId: listSocialAccounts
      tags: [social]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Connected social accounts without provider tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SocialAccountList"
  /auth/social/disconnect/{platform}:
    delete:
      operationId: disconnectSocialAccount
      tags: [social]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/SocialPlatform"
      responses:
        "200":
          description: Account disconnected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
    get:
      operationId: disconnectSocialAccountGet
      tags: [social]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/SocialPlatform"
      responses:
        "200":
          description: Account disconnected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /members/me:
    get:
      operationId: getCurrentMember
      tags: [members]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Current member profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberResponse"
    patch:
      operationId: updateCurrentMember
      tags: [members]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberUpdate"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberResponse"
  /members:
    get:
      operationId: listMembers
      tags: [members]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Chapter members
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberList"
  /members/{memberId}:
    get:
      operationId: getMember
      tags: [members]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/MemberId"
      responses:
        "200":
          description: Member profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicMemberResponse"
  /members/{memberId}/posts:
    get:
      operationId: listMemberPosts
      tags: [members]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/MemberId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Member posts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberPostsResult"
  /posts:
    post:
      operationId: createPost
      tags: [posts]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostInput"
      responses:
        "201":
          description: Post created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostResponse"
  /posts/feed:
    get:
      operationId: getFeed
      tags: [posts]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Chapter feed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedResult"
  /posts/{postId}:
    get:
      operationId: getPost
      tags: [posts]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PostId"
      responses:
        "200":
          description: Post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostResponse"
    delete:
      operationId: deleteOwnPost
      tags: [posts]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PostId"
      responses:
        "204":
          description: Post deleted
  /posts/{postId}/share:
    post:
      operationId: sharePost
      tags: [shares]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PostId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShareInput"
      responses:
        "201":
          description: Share tracked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareResult"
  /posts/{postId}/shares:
    get:
      operationId: getPostShares
      tags: [shares]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PostId"
      responses:
        "200":
          description: Post share breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareBreakdown"
  /posts/{postId}/share-preview:
    get:
      operationId: getPostSharePreview
      tags: [shares]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PostId"
        - in: query
          name: platform
          schema:
            type: string
            enum: [LinkedIn, Instagram, Facebook, TikTok, Direct Link]
      responses:
        "200":
          description: Platform-ready sharing text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharePreview"
  /upload/image:
    post:
      operationId: uploadImage
      tags: [uploads]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ImageUpload"
      responses:
        "201":
          description: Processed image uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageUploadResult"
  /upload/profile-wallpaper:
    post:
      operationId: uploadProfileWallpaper
      tags: [uploads]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ProfileWallpaperUpload"
      responses:
        "201":
          description: Processed JPG or PNG profile wallpaper uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageUploadResult"
  /admin/analytics/overview:
    get:
      operationId: getAdminOverview
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Chapter"
      responses:
        "200":
          description: Chapter overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOverview"
  /admin/posts:
    get:
      operationId: listAdminPosts
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Chapter"
        - name: featured
          in: query
          schema: { type: boolean }
        - name: authorId
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Moderatable posts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPostList"
  /admin/posts/{postId}/feature:
    patch:
      operationId: featurePost
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PostId"
      responses:
        "200":
          description: Post featured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPostResponse"
  /admin/posts/{postId}/unfeature:
    patch:
      operationId: unfeaturePost
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PostId"
      responses:
        "200":
          description: Post unfeatured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPostResponse"
  /admin/posts/{postId}:
    delete:
      operationId: deleteAdminPost
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PostId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModerationReason"
      responses:
        "200":
          description: Post deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /admin/members/all:
    get:
      operationId: listAdminMembers
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Chapter"
        - name: status
          in: query
          schema: { type: string, enum: [active, pending, banned] }
      responses:
        "200":
          description: Managed members
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMemberList"
  /admin/chapters:
    get:
      operationId: listAdminChapters
      tags: [admin]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Chapters available to the master administrator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminChapterList"
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Master administrator access required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /admin/members/pending:
    get:
      operationId: listPendingMembers
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Chapter"
      responses:
        "200":
          description: Pending applications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingMemberList"
  /admin/members/{memberId}/approve:
    patch:
      operationId: approveMember
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/MemberId"
      responses:
        "200":
          description: Member approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberModerationResult"
  /admin/members/{memberId}/deny:
    patch:
      operationId: denyMember
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/MemberId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModerationReason"
      responses:
        "200":
          description: Member denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberDenialResult"
  /admin/members/{memberId}/ban:
    patch:
      operationId: banMember
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/MemberId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModerationReason"
      responses:
        "200":
          description: Member banned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberModerationResult"
  /admin/members/{memberId}:
    delete:
      operationId: deleteMember
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/MemberId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModerationReason"
      responses:
        "200":
          description: Member permanently deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /admin/members/{memberId}/role:
    patch:
      operationId: updateMemberRole
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/MemberId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminMemberRoleUpdate"
      responses:
        "200":
          description: Member role updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberRoleUpdateResult"
        "400":
          description: Invalid role change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Master administrator access required or protected target
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Member not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /admin/members/{memberId}/activity:
    get:
      operationId: getMemberActivity
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/MemberId"
      responses:
        "200":
          description: Member activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberActivityResult"
  /admin/analytics/posts:
    get:
      operationId: getPostAnalytics
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Chapter"
      responses:
        "200":
          description: Leading posts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostAnalyticsResult"
  /admin/analytics/members:
    get:
      operationId: getMemberAnalytics
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Chapter"
      responses:
        "200":
          description: Leading contributors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberAnalyticsResult"
  /admin/analytics/shares-timeline:
    get:
      operationId: getShareTimeline
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Chapter"
      responses:
        "200":
          description: Thirty-day share timeline
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ShareTimelinePoint" }
  /admin/analytics/platforms:
    get:
      operationId: getPlatformAnalytics
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Chapter"
      responses:
        "200":
          description: Share platform percentages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformAnalytics"
  /admin/analytics/shares:
    get:
      operationId: getShareAnalytics
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Chapter"
      responses:
        "200":
          description: Share analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareAnalytics"
  /admin/settings:
    get:
      operationId: getChapterSettings
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Chapter"
      responses:
        "200":
          description: Chapter settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsResult"
    patch:
      operationId: updateChapterSettings
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Chapter"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChapterSettingsInput"
      responses:
        "200":
          description: Settings updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsResult"
  /admin/guidelines:
    get:
      operationId: getChapterGuidelines
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Chapter"
      responses:
        "200":
          description: Chapter guidelines
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuidelinesResult"
    patch:
      operationId: updateChapterGuidelines
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Chapter"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuidelinesInput"
      responses:
        "200":
          description: Guidelines updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuidelinesUpdateResult"
  /admin/logs:
    get:
      operationId: listModerationLogs
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Chapter"
        - name: action
          in: query
          schema:
            type: string
            enum: [delete_post, feature_post, unfeature_post, approve_member, deny_member, ban_member, delete_member, promote_admin, demote_admin, update_settings, update_guidelines]
      responses:
        "200":
          description: Moderation audit history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModerationLogList"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Chapter:
      name: chapter
      in: query
      required: false
      schema: { type: string }
    MemberId:
      name: memberId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PostId:
      name: postId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SocialPlatform:
      name: platform
      in: path
      required: true
      schema: { $ref: "#/components/schemas/SocialPlatform" }
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties: { status: { type: string } }
    Message:
      type: object
      required: [message]
      properties: { message: { type: string } }
    ErrorResponse:
      type: object
      required: [error, message]
      properties:
        error: { type: string }
        message: { type: string }
    Pagination:
      type: object
      required: [page, limit, total, totalPages, hasNextPage, hasPreviousPage]
      properties:
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        totalPages: { type: integer }
        hasNextPage: { type: boolean }
        hasPreviousPage: { type: boolean }
    SignupInput:
      type: object
      required: [email, password, name, title, company, chapter]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        name: { type: string }
        title: { type: string }
        company: { type: string }
        chapter: { type: string }
        bio: { type: string }
        signupSource: { type: string }
    SignupResult:
      type: object
      required: [id, email, name, chapter, status, message]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        name: { type: string }
        chapter: { type: string }
        status: { type: string }
        message: { type: string }
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    LoginResult:
      type: object
      required: [token, member]
      properties:
        token: { type: string }
        member: { $ref: "#/components/schemas/AuthMember" }
    AuthMember:
      type: object
      required: [id, name, email, role, status]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string }
        role: { type: string, enum: [member, admin, super_admin] }
        status: { type: string, enum: [pending, active, banned] }
    Member:
      type: object
      required: [id, email, name, title, company, chapter, themePreference, primaryColor, accentColor, profileBackgroundColor, profileWallpaperScale, autoPostShares, preferredPostPlatforms, role, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        name: { type: string }
        title: { type: string }
        company: { type: string }
        chapter: { type: string }
        bio: { type: [string, "null"] }
        profilePictureUrl: { type: [string, "null"], format: uri }
        themePreference: { type: string, enum: [light, dark] }
        primaryColor: { type: string }
        accentColor: { type: string }
        profileBackgroundColor: { type: string }
        profileWallpaperUrl: { type: [string, "null"], format: uri }
        profileWallpaperScale: { type: integer, minimum: 50, maximum: 200, default: 100 }
        autoPostShares: { type: boolean }
        preferredPostPlatforms:
          type: array
